[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genx-figure-studio"
version = "0.1.0"
description = "Interactive GUI for producing manuscript-ready figures from GenX reflectometry exports."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.scripts]
genx-figure-studio = "genx_figure_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]
